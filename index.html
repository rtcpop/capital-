    const P=x=>ci?(x===d?`${cy} is a city in ${x.c}.`:`${x.c} is not the country of ${cy}, which is in ${d.c}. Cities in ${x.c} include ${ex3(x)}.`):cm?`${x.c} is in ${x.ct}${x===d?"":", not in "+d.ct}.`:f?`This flag belongs to ${x.c}, whose capital is ${x.k}${x===d?"":", not the flag of "+d.c}.`:`${x.k} is the capital of ${x.c}${x===d?"":", not "+d.c}.`;
    const li=opts.map(x=>{const g=x===d;const tx=ci?(g?`${cn(cy)} is a city in ${nm(x.c,x.cf)}.`:`${nm(x.c,x.cf)} is not the country of ${cn(cy)}, which is in ${nm(d.c,d.cf)}. Cities there include ${ex3v(x)}.`):cm?`${nm(x.c,x.cf)} is in ${x.ct}${g?"":", not in "+d.ct}.`:f?`${x.f} is the flag of ${nm(x.c,x.cf)}, whose capital is ${nm(x.k,x.kf)}.`:`${nm(x.k,x.kf)} is the capital of ${nm(x.c,x.cf)}${g?"":", not "+d.c}.`;return `<li class="${g?"g":x===o?"b":""}">${g?"✓":"✗"} ${spk(P(x))} ${tx}${x===o?" <b>(your choice)</b>":""}</li>`}).join("");
    $("ex").innerHTML=`<b>Explanation</b> ${spk(opts.map(P).join(" "))} <small>(tap to hear all)</small><ul>${li}</ul>`;$("ex").hidden=false;
    $("nx").hidden=false;$("nx").onclick=()=>{i++;ask()};$("ex").scrollIntoView({behavior:"smooth",block:"nearest"})});
}

/* ---- streak & screen time ---- */
const DEV=(()=>{try{let d=localStorage.getItem("wc_dev");if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem("wc_dev",d)}return d}catch(e){return"x"}})();
const dk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtT=sec=>sec<3600?Math.floor(sec/60)+"m":Math.floor(sec/3600)+"h "+String(Math.floor(sec%3600/60)).padStart(2,"0")+"m";
let ses=null,bg=false,CM=new Date();CM.setDate(1);
function putEv(mp,e){const o=mp.get(e.id);if(!o){mp.set(e.id,e);return 1}if(e.type=="screen"&&e.sec>o.sec)o.sec=e.sec;return 0}
const streakSum=()=>{const x=streakInfo();return{current:x.cur,best:x.best,activeDays:x.total}};
function sesStart(){const n=Date.now();ses={id:"scr-"+DEV+"-"+n,t:n,day:dk(n),sec:0}}
function sesFlush(){if(!ses||!ses.sec)return;let e=EV.find(x=>x.id==ses.id);if(!e){e={id:ses.id,t:ses.t,type:"screen",day:ses.day,sec:0};EV.push(e)}e.sec=ses.sec;save()}
function dayTotals(){const m={};EV.forEach(e=>{if(e.type=="screen")m[e.day]=(m[e.day]||0)+e.sec});return m}
function streakInfo(){const m=dayTotals(),ok=k=>(m[k]||0)>=60;let cur=0;const d=new Date();if(!ok(dk(d)))d.setDate(d.getDate()-1);
 while(ok(dk(d))){cur++;d.setDate(d.getDate()-1)}
 const days=Object.keys(m).filter(ok).sort();let best=0,run=0,prev=null;
 days.forEach(k=>{const t=new Date(k+"T00:00:00");run=prev&&Math.round((t-prev)/864e5)==1?run+1:1;prev=t;best=Math.max(best,run)});
 return{m,cur,best,total:days.length}}
function streakPop(n){let p=$("skp");if(!p){document.body.insertAdjacentHTML("beforeend",'<div class="pop" id="skp" hidden><div class="pbx"><div>🔥</div><h2>You completed today!</h2><p id="skn"></p><button class="btn pri" id="sko">Continue</button></div></div>');p=$("skp");$("sko").onclick=()=>{p.hidden=true}}
 $("skn").textContent="Current streak: "+n+(n==1?" day":" days");p.hidden=false}
function sesTick(){
 if(document.hidden||bg)return;
 const now=Date.now();if(!ses||dk(now)!=ses.day){sesFlush();sesStart()}
 const before=dayTotals()[ses.day]||0,saved=(EV.find(x=>x.id==ses.id)||{sec:0}).sec;
 ses.sec+=1;const live=before-saved+ses.sec;
 if(ses.sec%10==0)sesFlush();
 if(live>=60&&live-1<60){let seen="";try{seen=localStorage.getItem("wc_pop")}catch(e){}
  if(seen!=ses.day){try{localStorage.setItem("wc_pop",ses.day)}catch(e){}sesFlush();streakPop(streakInfo().cur);if(!$("stk").hidden)streakUI()}}}
function streakUI(){
 sesFlush();const S=streakInfo(),m=S.m,y=CM.getFullYear(),mo=CM.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),today=dk(Date.now());
 let cells="";for(let i=0;i<first;i++)cells+="<div></div>";
 for(let d=1;d<=n;d++){const k=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),on=(m[k]||0)>=60;
  cells+=`<div class="cd${on?" on":""}${k==today?" td":""}">${d}${on?`<b>${Math.max(1,Math.floor(m[k]/60))}<i>min</i></b>`:""}</div>`}
 $("stk").innerHTML=`<div class="sk"><div class="big">🔥 ${S.cur}</div><div>day streak<small>Best: ${S.best} · Active days: ${S.total}</small><small>Today: ${fmtT(m[today]||0)} (1 minute keeps your streak)</small></div></div>
 <div class="calh"><button class="btn" id="pm">‹</button><b>${CM.toLocaleString("en-US",{month:"long"})} ${y}</b><button class="btn" id="nm2">›</button></div>
 <div class="cal">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cw">${x}</div>`).join("")}${cells}</div>
 <p class="sub">The number in a highlighted day is your screen time in minutes.</p>`;
 $("pm").onclick=()=>{CM.setMonth(CM.getMonth()-1);streakUI()};$("nm2").onclick=()=>{CM.setMonth(CM.getMonth()+1);streakUI()}}
window.__vis=v=>{bg=!v;if(!v){sesFlush();autoSync()}};
document.addEventListener("visibilitychange",()=>{if(document.hidden){sesFlush();autoSync()}});
$("t5").onclick=()=>tab(5);
if(!document.hidden)sesStart();setInterval(sesTick,1000);
</script>
